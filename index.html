<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA TRADER GLOBAL | SECURE</title>
    <style>
        :root { --gold: #ff9900; --dark: #0d0d0d; }
        body { background: var(--dark); color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .secure-box { background: #1a1a1a; padding: 30px; border-radius: 25px; border: 2px solid var(--gold); text-align: center; width: 300px; box-shadow: 0 0 30px rgba(255,153,0,0.2); }
        input { width: 85%; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #000; color: var(--gold); text-align: center; font-size: 18px; margin-bottom: 15px; outline: none; }
        .btn { background: var(--gold); color: black; border: none; padding: 12px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
        #main-bot { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="secure-box">
        <h2 style="color:var(--gold);">MA TRADER LOGIN</h2>
        <p style="font-size: 12px; color: #888;">ENTER ACCESS CODE</p>
        <input type="password" id="pass-input" placeholder="Enter Code...">
        <button class="btn" onclick="checkPass()">ACCESS BOT</button>
        <p id="err" style="color:red; font-size:11px; margin-top:10px;"></p>
    </div>

    <div id="main-bot" style="width: 90%; max-width: 400px; text-align: center;">
        <div class="secure-box" style="width: 100%;">
            <h1 style="color:var(--gold);">🇵🇰 MA TRADER PRO</h1>
            <div id="signal" style="font-size:45px; font-weight:900; margin:20px 0; min-height:60px;">READY</div>
            <button class="btn" style="height:60px; font-size:18px;" onclick="getSignal()">GENERATE SIGNAL</button>
            <p style="font-size:10px; color:#555; margin-top:15px;">AUTHORIZED OWNER: ALI</p>
        </div>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('pass-input').value;
            if(pass === "MA-786") {
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('main-bot').style.display = "block";
            } else {
                document.getElementById('err').innerText = "INVALID CODE! TRY AGAIN.";
            }
        }
        function getSignal() {
            const sig = document.getElementById('signal');
            sig.innerText = "SCANNING...";
            sig.style.color = "white";
            setTimeout(() => {
                const up = Math.random() > 0.5;
                sig.style.color = up ? "#00ff88" : "#ff3366";
                sig.innerText = up ? "CALL ↑" : "PUT ↓";
            }, 1200);
        }
    </script>
</body>
</html>
